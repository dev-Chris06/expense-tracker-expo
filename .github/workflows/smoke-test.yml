name: Smoke test (emulator)

# Construit l'app pour l'émulateur (x86_64), la lance sur un Android
# virtuel hébergé par GitHub et vérifie qu'elle démarre sans planter.
# Remplace le téléphone branché en USB pour lire le journal d'erreur.
on:
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      # Même build release que pour le téléphone, mais pour les processeurs
      # des émulateurs (x86 = 32 bits, x86_64 = 64 bits).
      - name: Build release APK (x86 + x86_64)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86,x86_64

      - name: Upload emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: emulator-apk
          path: android/app/build/outputs/apk/release/app-release.apk

  # Plusieurs versions d'Android, en 32 et 64 bits.
  emulator:
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 24, arch: x86 }
          - { api: 26, arch: x86 }
          - { api: 28, arch: x86 }
          - { api: 30, arch: x86 }
          - { api: 29, arch: x86_64 }
          - { api: 31, arch: x86_64 }
          - { api: 34, arch: x86_64 }
          - { api: 35, arch: x86_64 }
          - { api: 36, arch: x86_64 }
          # Pages mémoire de 16 Ko, comme sur certains téléphones récents.
          - { api: 35, arch: x86_64, target: google_apis_ps16k }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download emulator APK
        uses: actions/download-artifact@v4
        with:
          name: emulator-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: ${{ matrix.target || 'google_apis' }}
          disable-animations: true
          # 2 Go par défaut : l'image 16 Ko tuait les apps faute de mémoire.
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke-test.sh apk/app-release.apk com.devchris06.expensetracker.expo smoke

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-api${{ matrix.api }}-${{ matrix.arch }}-${{ matrix.target || 'google_apis' }}
          path: smoke/
